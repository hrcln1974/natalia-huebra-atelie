<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão | Ateliê Natália Huebra</title><meta name="robots" content="noindex,nofollow"><style>
:root{--black:#70553e;--brown:#8b6b4d;--gold:#a77b43;--gold2:#d6b77c;--cream:#f7efe3;--white:#fff;--text:#3b3028;--muted:#75685d;--border:rgba(167,123,67,.25)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font:14px Arial,sans-serif}.hidden{display:none!important}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--black);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-family:Georgia,serif;font-size:22px;color:var(--gold2);margin:5px 10px 30px}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#ddd;padding:11px 14px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--brown);color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{font-family:Georgia,serif;font-weight:500;margin:.3rem 0}.logout{background:transparent;border:1px solid var(--gold);padding:9px 14px;border-radius:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.kpi{background:#fff;border:1px solid var(--border);padding:18px;border-radius:10px}.kpi b{display:block;font:28px Georgia;margin-top:7px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:18px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.btn{background:var(--black);color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.btn.gold{background:var(--gold)}.btn.light{background:#eee;color:#222}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:#faf8f4;padding:14px;border-radius:9px;margin-bottom:18px}.form label{font-size:12px;font-weight:600}.form input,.form select,.form textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #d8cec0;border-radius:6px;background:#fff}.form textarea{min-height:90px}.full{grid-column:1/-1}.status{font-size:12px;color:var(--muted)}.notice{padding:10px;background:#f7efd9;border:1px solid #e3cc92;border-radius:7px;margin-bottom:12px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7efe3,#ead8c0)}.login-box{background:var(--cream);width:min(420px,calc(100% - 32px));padding:30px;border-radius:12px}.login-box h1{font:34px Georgia;margin-top:0}.login-box input{display:block;width:100%;margin:10px 0;padding:13px;border:1px solid #ccc}.error{color:#9a1d1d;margin:8px 0}.thumb{width:58px;height:58px;object-fit:cover;border-radius:6px}.muted{color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:16px}.form{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.nav{grid-template-columns:1fr}.top{align-items:flex-start}}
</style><style>
.back-site{position:fixed;top:16px;right:20px;z-index:9999;display:inline-flex;align-items:center;padding:9px 14px;border:1px solid rgba(201,168,106,.55);border-radius:999px;background:#111;color:#e4c98a;text-decoration:none;font:600 12px/1 Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.back-site:hover{transform:translateY(-1px)}
</style>
</head><body>
  <a class="back-site" href="/" aria-label="Voltar ao site público">← Ver site público</a>
<div id="login" class="login"><form class="login-box" id="loginForm"><h1>Ateliê Natália Huebra</h1><p>Área exclusiva de gestão.</p><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button class="btn gold" style="width:100%">Entrar</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">Natália Huebra<br><small style="font:10px Arial;letter-spacing:.25em">GESTÃO</small></div><nav class="nav" id="nav">
<button data-view="dashboard" class="active">Dashboard</button><button data-view="clients">Clientes</button><button data-view="leads">Leads / CRM</button><button data-view="appointments">Agenda</button><button data-view="products">Vestidos / Coleções</button><button data-view="gallery">Galeria</button><button data-view="videos">Vídeos</button><button data-view="quotes">Orçamentos</button><button data-view="orders">Pedidos</button><button data-view="measurements">Medidas</button><button data-view="payments">Financeiro</button><button data-view="settings">Configurações</button><button data-view="audit">Auditoria</button></nav></aside>
<main class="main"><div class="top"><div><div style="color:var(--gold);letter-spacing:.18em;font-size:11px">PLATAFORMA PREMIUM</div><h1 id="title">Dashboard</h1></div><button class="logout" id="logout">Sair</button></div><section id="content"></section></main></div>
<script>
const $=s=>document.querySelector(s);let current='dashboard';let editing=null;
const labels={clients:['Clientes',['name','phone','email','event_type','event_date','instagram','notes','status']],leads:['Leads / CRM',['name','phone','email','interest','message','source','status','score','next_follow_up','notes','tags']],appointments:['Agenda',['client_id','starts_at','kind','notes','status']],products:['Vestidos / Coleções',['name','code','category','collection','size','color','fabric','description','price','status','image']],gallery:['Galeria',['title','category','url','caption','status','order']],videos:['Vídeos',['title','category','url','caption','type','status','order']],quotes:['Orçamentos',['number','client_id','total','deposit','balance','valid_until','status','notes']],orders:['Pedidos',['number','client_id','quote_id','status','total','notes']],measurements:['Medidas',['client_id','bust','waist','hip','height','shoulder','arm','length','shoe','notes']],payments:['Financeiro',['client_id','order_id','description','amount','due_date','paid_at','status']]};
async function api(url,opt={}){const isForm=typeof FormData!=='undefined'&&opt.body instanceof FormData;const headers={...(opt.headers||{})};if(!isForm&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(url,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){try{await api('/api/auth/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});boot()}catch(x){$('#loginError').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.view;editing=null;render()});
async function render(){try{const c=$('#content');$('#title').textContent=current==='dashboard'?'Dashboard':current==='audit'?'Auditoria':current==='settings'?'Configurações':labels[current]?.[0]||current;if(current==='dashboard'){const d=await api('/api/dashboard');c.innerHTML='<div class="grid">'+[['Clientes',d.clients],['Leads',d.leads],['Agenda hoje',d.appointments],['Vestidos',d.products],['Galeria',d.gallery],['Vídeos',d.videos],['Pedidos',d.orders],['Pendente',`R$ ${Number(d.pending).toFixed(2)}`]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+'</div><div class="card"><h2>CRM de Leads</h2><p>Leads do formulário público entram automaticamente como <b>novo</b>, recebem pontuação de 0 a 100 e podem ser acompanhados até conversão.</p></div><div class="card"><h2>Site integrado</h2><p>Catálogo, galeria, vídeos e configurações publicados aqui são carregados pelo site público através da API. Cadastre ou edite um item e atualize o site para conferir.</p></div>';return}
if(current==='settings'){const s=await api('/api/settings');c.innerHTML='<div class="card"><div class="notice">Estas configurações alimentam o site público automaticamente.</div><form class="form" id="settingsForm">'+Object.entries(s).map(([k,v])=>`<label>${esc(k)}<input name="${esc(k)}" value="${esc(v)}"></label>`).join('')+'<div class="full"><button class="btn gold">Salvar configurações</button></div></form></div>';$('#settingsForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));await api('/api/settings',{method:'PUT',body:JSON.stringify(o)});alert('Configurações salvas e integradas ao site.');};return}
if(current==='audit'){const rows=await api('/api/audit');c.innerHTML='<div class="card"><table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>ID</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.created_at)}</td><td>${esc(r.email||'-')}</td><td>${esc(r.action)}</td><td>${esc(r.entity)}</td><td>${esc(r.entity_id||'')}</td></tr>`).join('')+'</tbody></table></div>';return}
const cfg=labels[current];const rows=await api('/api/'+current);const cols=cfg[1];let html='<div class="card"><div class="actions"><button class="btn gold" id="new">+ Novo registro</button><button class="btn light" id="refresh">Atualizar</button></div>';if(current==='gallery'||current==='videos')html+='<div class="notice"><b>Cadastro de mídia:</b> escolha um arquivo abaixo ou informe uma URL/caminho. O upload é salvo no próprio projeto e já fica disponível no site público. Imagens: JPG, PNG, WEBP. Vídeos: MP4, WEBM ou MOV (até 25 MB).</div>';if(editing)html+=formHtml(editing,cols);html+='<table><thead><tr><th>ID</th>'+cols.map(x=>`<th>${esc(x)}</th>`).join('')+'<th>Ações</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${r.id}</td>${cols.map(x=>`<td>${x==='image'||x==='url'?(r[x]?`<a href="${esc(r[x])}" target="_blank" rel="noopener"><img class="thumb" src="${esc(r[x])}" onerror="this.style.display='none'"></a>`:'-'):esc(r[x])}</td>`).join('')}<td><button class="btn light" onclick="editRow(${r.id})">Editar</button> <button class="btn" onclick="del(${r.id})">Excluir</button></td></tr>`).join('')+'</tbody></table></div>';c.innerHTML=html;$('#new').onclick=()=>{editing={id:null};render()};$('#refresh').onclick=()=>{editing=null;render()};if(editing){$('#crudForm').onsubmit=saveRow}} catch(e){$('#content').innerHTML='<div class="card"><div class="error">'+esc(e.message||'Erro ao carregar dados')+'</div></div>'}
}
function formHtml(obj,cols){
 const media=current==='gallery'||current==='videos';
 const fileAccept=current==='gallery'?'.jpg,.jpeg,.png,.webp,.gif':'.mp4,.webm,.mov';
 const fieldsHtml=cols.map(x=>{
  let val=obj[x]??'';
  let type=['description','message','notes','caption'].includes(x)?'textarea':'input';
  if(x==='status'){
   const opts=current==='leads'?['novo','contatado','qualificado','agendado','convertido','perdido']:['publicado','disponivel','promocao','novo','pendente','inativo','oculto','concluido'];
   return `<label>${esc(x)}<select name="${esc(x)}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
  }
  if(type==='textarea')return `<label>${esc(x)}<textarea name="${esc(x)}">${esc(val)}</textarea></label>`;
  return `<label>${esc(x)}<input name="${esc(x)}" ${x==='score'?'readonly':''} value="${esc(val)}"></label>`;
 }).join('');
 const upload=media?`<div class="full media-upload"><label>Arquivo para ${current==='gallery'?'foto':'vídeo'}<input id="mediaFile" type="file" accept="${fileAccept}"><small class="status">Ao escolher o arquivo e salvar, o upload será feito automaticamente.</small></label></div>`:'';
 return `<form class="form" id="crudForm"><div class="full"><strong>${obj.id?'Editando registro #'+obj.id:'Novo registro'}</strong></div>${fieldsHtml}${upload}<div class="full"><button class="btn gold" id="saveBtn">Salvar</button> <button type="button" class="btn light" onclick="editing=null;render()">Cancelar</button><span id="saveStatus" class="status"></span></div></form>`;
}
window.editRow=async id=>{const rows=await api('/api/'+current);editing=rows.find(r=>r.id===id)||null;render()};window.del=async id=>{if(confirm('Excluir este registro?')){await api('/api/'+current+'/'+id,{method:'DELETE'});editing=null;render()}};
async function saveRow(e){
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target));
 delete data.file;
 const media=current==='gallery'||current==='videos';
 const file=document.getElementById('mediaFile')?.files?.[0];
 const status=document.getElementById('saveStatus');
 try{
  if(media&&file){
   status.textContent='Enviando arquivo...';
   const fd=new FormData(); fd.append('file',file);
   const uploaded=await api('/api/upload',{method:'POST',body:fd});
   data.url=uploaded.url;
   if(current==='videos')data.type=uploaded.type==='video'?'local':'local';
   status.textContent='Arquivo enviado. Salvando registro...';
  }
  if(!data.url && media) throw Error(current==='gallery'?'Informe uma URL ou selecione uma foto.':'Informe uma URL ou selecione um vídeo.');
  if(editing?.id)await api('/api/'+current+'/'+editing.id,{method:'PUT',body:JSON.stringify(data)});
  else await api('/api/'+current,{method:'POST',body:JSON.stringify(data)});
  editing=null;render();
 }catch(err){status.textContent=err.message||'Erro ao salvar';}
}
boot();
</script></body></html>
